name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 40-character commit SHA published by Quality
        required: true

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH identity and pinned host key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_PRIVATE_KEY:?Missing VPS_SSH_PRIVATE_KEY}"
          : "${VPS_SSH_KNOWN_HOSTS:?Missing VPS_SSH_KNOWN_HOSTS}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Replace only the web app
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_NAMESPACE: nivz0911
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9_-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USERNAME:?Missing VPS_USERNAME}"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USERNAME@$VPS_HOST" \
            "bash ~/apps/file-storage-platform/deploy.sh frontend $IMAGE_TAG $DOCKERHUB_NAMESPACE"
