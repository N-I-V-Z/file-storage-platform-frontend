name: Check PR Source Branch for Main

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify head branch is develop or hotfix/*
        run: |
          HEAD_BRANCH="${{ github.head_ref }}"
          if [[ "$HEAD_BRANCH" != "develop" && "$HEAD_BRANCH" != hotfix/* ]]; then
            echo "Error: Only 'develop' or 'hotfix/*' can be merged into 'main'. Current source branch: '$HEAD_BRANCH'"
            exit 1
          fi
          echo "Valid source branch: $HEAD_BRANCH"
