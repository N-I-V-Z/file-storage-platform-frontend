name: Quality

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      API_INTERNAL_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Require public build URLs
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          : "${NEXT_PUBLIC_APP_URL:?Missing NEXT_PUBLIC_APP_URL repository variable}"
          : "${NEXT_PUBLIC_API_BASE_URL:?Missing NEXT_PUBLIC_API_BASE_URL repository variable}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            nivz0911/file-storage-platform-frontend:latest
            nivz0911/file-storage-platform-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Pull published image and replace the web app
        env:
          IMAGE_TAG: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USERNAME:?Missing VPS_USERNAME}"
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$IMAGE_TAG" ]]; then
            echo "A newer main commit exists; skipping this deployment"
            exit 0
          fi
          ssh -p "$VPS_PORT" -o BatchMode=yes \
            -o PubkeyAuthentication=no -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=no \
            "$VPS_USERNAME@$VPS_HOST" \
            "env FSP_COMPOSE_FILE=compose.instabox.yaml FSP_ENV_FILE=.env.instabox bash /apps/file-storage-platform/deploy.sh frontend $IMAGE_TAG nivz0911"
